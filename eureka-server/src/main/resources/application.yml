server:
  port: ${EUREKA_PORT:8761}

spring:
  application:
    name: eureka-server

eureka:
  client:
    # A standalone registry neither registers with itself nor fetches a registry.
    register-with-eureka: false
    fetch-registry: false
  instance:
    # Stable addressing inside the `backend` Docker network.
    prefer-ip-address: true
    # Unique per instance. INSTANCE_ID is set by Compose (pedidos-1, ...) and is echoed in
    # X-Service-Instance and in the structured log line.
    instance-id: ${spring.application.name}:${INSTANCE_ID:${HOSTNAME:local}}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
  server:
    # Critical for a measurable failure drill: with self-preservation enabled and a 15 s lease,
    # the registry would never evict a stopped instance.
    enable-self-preservation: false
    # Default sweep is 60 s and would dominate the whole detection window.
    eviction-interval-timer-in-ms: 3000
    # Default response cache is 30 s; the read-only cache adds a second layer of staleness.
    response-cache-update-interval-ms: 1000
    use-read-only-response-cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
