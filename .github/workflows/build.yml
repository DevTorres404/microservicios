name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify reactor
        run: mvn -q verify
